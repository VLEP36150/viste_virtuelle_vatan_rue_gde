<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Ma Visite Virtuelle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #panorama { width: 100%; height: 100vh; }
        
        /* Style pour le titre de la pièce */
        .titre-piece {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 1.1rem;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="titre-affichage" class="titre-piece">L'Entrée</div>
    <div id="panorama"></div>

    <script>
        var viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "entree",
                "sceneFadeDuration": 1000,
                "autoLoad": true,
                "hfov": 100
            },

            "scenes": {
                "entree": {
                    "title": "L'Entrée",
                    "panorama": "vatan_entree_sejour_comp.jpg", 
                    "hotSpots": [
                        {
                            "pitch": -10, 
                            "yaw": 0,
                            "type": "scene",
                            "text": "Aller à la cuisine",
                            "sceneId": "cuisine",
                            "targetYaw": 180,
                            "targetPitch": 0
                        },
                        {
                            "pitch": -10, 
                            "yaw": -90,
                            "type": "scene",
                            "text": "Aller à l'étage",
                            "sceneId": "chambre_gauche"
                        }
                    ]
                },

                "cuisine": {
                    "title": "La cuisine",
                    "panorama": "vatan_cuis_wc_comp.jpg",
                    "hotSpots": [
                        {
                            "pitch": -10,
                            "yaw": 135,
                            "type": "scene",
                            "text": "Retourner à l'Entrée",
                            "sceneId": "entree",
                            "targetYaw": 180,
                            "targetPitch": 0
                        }
                    ]
                },

                "chambre_gauche": {
                    "title": "La chambre gauche",
                    "panorama": "vatan_ch_1.jpg",
                    "hotSpots": [
                        {
                            "pitch": -10,
                            "yaw": -180,
                            "type": "scene",
                            "text": "Aller à chambre droite",
                            "sceneId": "chambre_droite",
                            "targetYaw": 180,
                            "targetPitch": 0
                        }
                    ]
                },

                "chambre_droite": {
                    "title": "La chambre droite",
                    "panorama": "vatan_ch_2.jpg",
                    "hotSpots": [
                        {
                            "pitch": 10,
                            "yaw": -135,
                            "type": "scene",
                            "text": "Retourner à l'Entrée",
                            "sceneId": "entree",
                            "targetYaw": 180, // On regarde derrière soi en arrivant
                            "targetPitch": 10
                        }
                    ]
                }
            }
        });

        // Mise à jour automatique du titre lors du changement de pièce
        viewer.on('scenechange', function(sceneId) {
            var title = viewer.getScene().title;
            document.getElementById('titre-affichage').innerText = title;
        });
    </script>
</body>
</html>
