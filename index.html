<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Visite Virtuelle - VATAN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: sans-serif; }
        #panorama { width: 100%; height: 100vh; }

        /* MENU DU BAS */
        .bottom-nav {
            position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; z-index: 1000; width: 95%; justify-content: center;
        }
        .nav-btn {
            background: rgba(0, 0, 0, 0.85); color: white; border: 1px solid white;
            padding: 12px 5px; border-radius: 8px; cursor: pointer; font-size: 0.75rem; flex: 1; text-align: center;
        }

        /* BOUTON INFOS */
        #desc-toggle {
            position: absolute; right: 0; top: 40%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.8); color: white; border: 1px solid white;
            padding: 15px 8px; border-radius: 10px 0 0 10px; cursor: pointer; z-index: 2000;
            writing-mode: vertical-rl; text-orientation: mixed;
        }

        /* PANNEAU DESCRIPTION CACHÉ */
        #desc-panel {
            position: absolute; right: -100%; top: 0; width: 85%; height: 100%;
            background: rgba(0, 0, 0, 0.95); color: white; padding: 25px;
            z-index: 3000; transition: right 0.4s ease; box-sizing: border-box;
        }
        #desc-panel.open { right: 0; }
        .close-desc { background: white; color: black; padding: 8px 15px; border-radius: 5px; float: right; font-weight: bold; }
    </style>
</head>
<body>

    <div id="desc-toggle" onclick="toggleDesc()">INFOS</div>

    <div id="desc-panel">
        <div class="close-desc" onclick="toggleDesc()">FERMER</div>
        <br><br>
        <h2>22 rue Grande, VATAN</h2>
        <hr>
        <p>Visite T3 Duplex</p>
    </div>

    <div class="bottom-nav">
        <div class="nav-btn" onclick="viewer.loadScene('entree', 0, 0)">Entrée</div>
        <div class="nav-btn" onclick="viewer.loadScene('cuisine', 0, 0)">Cuisine</div>
        <div class="nav-btn" onclick="viewer.loadScene('chambre_gauche', 0, 0)">Ch. Gauche</div>
        <div class="nav-btn" onclick="viewer.loadScene('chambre_droite', 0, 0)">Ch. Droite</div>
    </div>

    <div id="panorama"></div>

    <script>
        var viewer = pannellum.viewer('panorama', {
            "default": {
                "firstScene": "entree",
                "autoLoad": true,
                "sceneFadeDuration": 1000,
                "hfov": 100,
                "pitch": 0
            },
            "scenes": {
                "entree": {
                    "panorama": "vatan_entree_sejour_comp.jpg",
                    "hotSpots": [
                        { "pitch": -12, "yaw": 0, "type": "scene", "text": "Cuisine", "sceneId": "cuisine", "targetYaw": 0 }
                    ]
                },
                "cuisine": {
                    "panorama": "vatan_cuis_wc_comp.jpg",
                    "hotSpots": [
                        { "pitch": -12, "yaw": 135, "type": "scene", "text": "Retour", "sceneId": "entree", "targetYaw": 0 }
                    ]
                },
                "chambre_gauche": {
                    "panorama": "vatan_ch_1.jpg",
                    "hotSpots": [
                        { "pitch": -12, "yaw": -180, "type": "scene", "text": "Ch. Droite", "sceneId": "chambre_droite", "targetYaw": 0 }
                    ]
                },
                "chambre_droite": {
                    "panorama": "vatan_ch_2.jpg",
                    "hotSpots": [
                        { "pitch": -12, "yaw": -10, "type": "scene", "text": "Retour", "sceneId": "entree", "targetYaw": 0 }
                    ]
                }
            }
        });

        function toggleDesc() {
            document.getElementById('desc-panel').classList.toggle('open');
        }
    </script>
</body>
</html>

        });

        function toggleDesc() {
            document.getElementById('desc-panel').classList.toggle('open');
        }
    </script>
</body>
</html>
