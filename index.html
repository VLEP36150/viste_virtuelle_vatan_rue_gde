<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Visite Virtuelle - 22 rue Grande VATAN</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
        #panorama { width: 100%; height: 100vh; }

        /* On agrandit les boutons pour le confort mobile */
        .pnlm-hotspot-base { width: 48px !important; height: 48px !important; margin-left: -24px !important; margin-top: -24px !important; }
        .pnlm-scene-hotspot { background-color: rgba(255, 255, 255, 0.4) !important; border: 3px solid white !important; border-radius: 50% !important; }
        
        /* Style du titre natif de Pannellum pour qu'il soit gros et lisible */
        .pnlm-title-box { background: rgba(0,0,0,0.7) !important; border-radius: 20px !important; padding: 5px 15px !important; }
    </style>
</head>
<body>

    <div id="panorama"></div>

    <script>
        pannellum.viewer('panorama', {
            "default": {
                "firstScene": "entree",
                "author": "Visite Virtuelle T3 Duplex", // S'affichera sous le titre
                "sceneFadeDuration": 1200,
                "autoLoad": true,
                "hfov": 100,
                "showZoomCtrl": false, // Plus propre sur mobile
                "keyboardZoom": false
            },

            "scenes": {
                "entree": {
                    "title": "L'Entrée & Séjour",
                    "panorama": "vatan_entree_sejour_comp.jpg", 
                    "hotSpots": [
                        { "pitch": -10, "yaw": 0, "type": "scene", "text": "Cuisine", "sceneId": "cuisine" },
                        { "pitch": -10, "yaw": -90, "type": "scene", "text": "À l'étage", "sceneId": "chambre_gauche" }
                    ]
                },
                "cuisine": {
                    "title": "La Cuisine",
                    "panorama": "vatan_cuis_wc_comp.jpg",
                    "hotSpots": [
                        { "pitch": -10, "yaw": 135, "type": "scene", "text": "Retour Entrée", "sceneId": "entree", "targetYaw": 180 }
                    ]
                },
                "chambre_gauche": {
                    "title": "La Chambre Gauche",
                    "panorama": "vatan_ch_1.jpg",
                    "hotSpots": [
                        { "pitch": -10, "yaw": -180, "type": "scene", "text": "Chambre Droite", "sceneId": "chambre_droite" }
                    ]
                },
                "chambre_droite": {
                    "title": "La Chambre Droite",
                    "panorama": "vatan_ch_2.jpg",
                    "hotSpots": [
                        { "pitch": -10, "yaw": -10, "type": "scene", "text": "Retour Entrée", "sceneId": "entree", "targetYaw": 180 }
                    ]
                }
            }
        });
    </script>
</body>
</html>
