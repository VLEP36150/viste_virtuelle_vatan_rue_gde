<!DOCTYPE HTML>
<html>
<head>
    <meta charset="utf-8">
    <title>Ma Visite Virtuelle</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
    <style>
        #panorama { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="panorama"></div>
    <script>
        pannellum.viewer('panorama', {
    "default": {
        "firstScene": "entree", // La pièce où commence la visite
         "sceneFadeDuration": 1000 // Transition douce de 1 seconde
    },

    "scenes": {
        "entree": {
            "title": "L'Entrée",
            "panorama": "vatan_entree_sejour_comp.jpg", 
            "hotSpots": [
                {
                    "pitch": -10, 
                    "yaw": 0,
                    "type": "scene",
                    "text": "Aller à la cuisine",
                    "sceneId": "cuisine"
                    
                }
            ]
             "hotSpots": [
                {
                    "pitch": -10, 
                    "yaw": 90,
                    "type": "scene",
                    "text": "Aller à l'étage",
                    "sceneId": "Chambre_gauche"
                    
                }
            ]
        },
        "cuisine": {
            "title": "La cuisine",
            "panorama": "vatan_cuis_wc_comp.jpg",
            "hotSpots": [
                {
                    "pitch": -10,
                    "yaw": 135,
                    "type": "scene",
                    "text": "Retourner à l'Entrée",
                    "sceneId": "entree"
                }
            ]
        }
       "chambre gauche": {
            "title": "La chambre gauche",
            "panorama": "vatan_ch_1_comp.jpg",
            "hotSpots": [
                {
                    "pitch": -10,
                    "yaw": 135,
                    "type": "scene",
                    "text": "Aller à chambre droite",
                    "sceneId": "chambre droite"
                }
            ]
        }
        "chambre droite": {
            "title": "La chambre droite",
            "panorama": "vatan_ch_2_comp.jpg",
            "hotSpots": [
                {
                    "pitch": -10,
                    "yaw": -90,
                    "type": "scene",
                    "text": "retourner à entree",
                    "sceneId": "entree"
                }
            ]
        }
    }
});
    </script>
</body>
</html>
